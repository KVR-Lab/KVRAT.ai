name: KVR Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Read the exact pnpm version from package.json packageManager.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build KVR Core
        run: pnpm build

      - name: Run tests
        run: pnpm test --runInBand

      - name: Test supplier registration API
        run: pnpm exec jest --config apps/kvr-web/jest.config.cjs --runInBand
